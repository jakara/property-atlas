disabled_rules:
  - trailing_whitespace   # Edit tool strips it; produces noise
  - todo                  # TODOs expected during early implementation

opt_in_rules:
  - force_unwrapping
  - private_outlet
  - explicit_init
  - closure_spacing
  - empty_count
  - sorted_imports

included:
  - TianjinHouse
  - TianjinHouseTests
  - Scripts

file_length:
  warning: 300
  error: 400

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 200
  error: 300

function_body_length:
  warning: 40
  error: 60

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
    - f

type_name:
  excluded:
    - ID
